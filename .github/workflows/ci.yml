name: CI — Train Model & Publish Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: "Number of estimators"
        default: "200"
        required: false
      max_depth:
        description: "Max depth (0 = None)"
        default: "10"
        required: false
      model_type:
        description: "Model type (RandomForest | GradientBoosting)"
        default: "RandomForest"
        required: false

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow
  PYTHON_VERSION: "3.12.7"

jobs:
  # JOB 1: Train Model with MLflow Project
  train:
    name: Train & Log MLflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        working-directory: MLProject
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Dataset Exists
        run: |
          if [ ! -f "MLProject/dataset_preprocessing/train.csv" ]; then
            echo "ERROR: dataset_preprocessing/train.csv not found!"
            echo "Please ensure preprocessed data is committed."
            exit 1
          fi
          echo "Dataset found ✓"
          ls -lh MLProject/dataset_preprocessing/

      - name: Run MLflow Project Training
        working-directory: MLProject
        env:
          MLFLOW_TRACKING_URI: mlruns
        run: |
          N_EST="${{ github.event.inputs.n_estimators || '200' }}"
          MAX_D="${{ github.event.inputs.max_depth || '10' }}"
          M_TYPE="${{ github.event.inputs.model_type || 'RandomForest' }}"

          echo "Training with: n_estimators=${N_EST}, max_depth=${MAX_D}, model=${M_TYPE}"

          mlflow run . \
            --env-manager=local \
            -P n_estimators=${N_EST} \
            -P max_depth=${MAX_D} \
            -P model_type=${M_TYPE}

      - name: Show MLflow Results
        working-directory: MLProject
        run: |
          echo "=== MLflow Runs ==="
          mlflow runs list --experiment-name "Heart_Disease_CI" || true
          echo ""
          echo "=== Run ID ==="
          cat run_id.txt || echo "run_id.txt not found"

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/artifacts/
            MLProject/run_id.txt
          retention-days: 30

      - name: Upload Training Plots
        uses: actions/upload-artifact@v4
        with:
          name: training-plots-${{ github.run_number }}
          path: MLProject/artifacts/*.png
          retention-days: 14
          if-no-files-found: warn

  # JOB 2: Build & Push Docker Image
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=raw,value=v${{ github.run_number }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker Image Info
        run: |
          echo "Image: ${{ env.DOCKERHUB_IMAGE }}" > DockerHub.txt
          echo "Tags:"  >> DockerHub.txt
          echo "${{ steps.meta.outputs.tags }}" >> DockerHub.txt
          echo ""       >> DockerHub.txt
          echo "Built at: $(date -u)" >> DockerHub.txt
          echo "Run #   : ${{ github.run_number }}" >> DockerHub.txt
          cat DockerHub.txt

      - name: Upload DockerHub Info
        uses: actions/upload-artifact@v4
        with:
          name: docker-info
          path: DockerHub.txt
          retention-days: 30

      - name: Image Summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKERHUB_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
